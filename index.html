<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atomic Habit Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar hiding for smooth mobile horizontal scrolling */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20 font-sans antialiased selection:bg-emerald-500 selection:text-white">

    <div class="max-w-md mx-auto px-4 py-6">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">Atomic Tracker</h1>
                <p class="text-xs text-slate-400 mt-0.5">Focus on identity. Never miss twice.</p>
            </div>
            <button onclick="openModal()" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-slate-950 font-semibold text-sm px-3.5 py-2 rounded-xl flex items-center gap-1.5 transition-all shadow-lg shadow-emerald-500/20">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>New</span>
            </button>
        </header>

        <!-- View Tabs -->
        <div class="flex bg-slate-800/80 p-1 rounded-xl mb-6 border border-slate-700/50">
            <button id="tab-week" onclick="switchTab('week')" class="flex-1 py-2 text-xs font-medium rounded-lg transition-all bg-emerald-500 text-slate-950 shadow-sm">
                Today & Week
            </button>
            <button id="tab-month" onclick="switchTab('month')" class="flex-1 py-2 text-xs font-medium rounded-lg text-slate-400 transition-all hover:text-slate-200">
                Monthly Overview
            </button>
        </div>

        <!-- Dynamic Date Selector (Week View) -->
        <div id="date-strip-container" class="mb-6">
            <div id="date-strip" class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                <!-- Days populated via JS -->
            </div>
        </div>

        <!-- Habit List Container -->
        <main id="habit-container" class="space-y-4">
            <!-- Habits rendered dynamically via JS -->
        </main>
    </div>

    <!-- Modal: Add New Habit -->
    <div id="habit-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-slate-800 w-full max-w-md rounded-t-2xl sm:rounded-2xl border border-slate-700/60 p-6 shadow-2xl transition-all">
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-lg font-bold text-white">Create Atomic Habit</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="habit-form" onsubmit="saveHabit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Habit Action</label>
                    <input type="text" id="input-name" required placeholder="e.g. Read 5 pages" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-100 placeholder-slate-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Identity Shift ("I am...")</label>
                    <input type="text" id="input-identity" placeholder="e.g. I am a reader" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-100 placeholder-slate-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">2-Minute Version (Optional)</label>
                    <input type="text" id="input-two-min" placeholder="e.g. Open book to page 1" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-100 placeholder-slate-500">
                </div>

                <div class="pt-2 flex gap-3">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium py-2.5 rounded-xl transition-all">Cancel</button>
                    <button type="submit" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-slate-950 text-sm font-semibold py-2.5 rounded-xl transition-all shadow-lg shadow-emerald-500/20">Save Habit</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // State
        let habits = JSON.parse(localStorage.getItem('atomic_habits') || '[]');
        let selectedDate = formatDateKey(new Date());
        let currentTab = 'week';

        // Helper: Date formatting YYYY-MM-DD using local time
        function formatDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Initialize app
        document.addEventListener('DOMContentLoaded', () => {
            renderDateStrip();
            renderApp();
            lucide.createIcons();
        });

        // Switch between Today & Week and Monthly Overview
        function switchTab(tab) {
            currentTab = tab;
            const weekBtn = document.getElementById('tab-week');
            const monthBtn = document.getElementById('tab-month');
            const dateContainer = document.getElementById('date-strip-container');

            if (tab === 'week') {
                weekBtn.className = "flex-1 py-2 text-xs font-medium rounded-lg transition-all bg-emerald-500 text-slate-950 shadow-sm";
                monthBtn.className = "flex-1 py-2 text-xs font-medium rounded-lg text-slate-400 transition-all hover:text-slate-200";
                dateContainer.classList.remove('hidden');
            } else {
                monthBtn.className = "flex-1 py-2 text-xs font-medium rounded-lg transition-all bg-emerald-500 text-slate-950 shadow-sm";
                weekBtn.className = "flex-1 py-2 text-xs font-medium rounded-lg text-slate-400 transition-all hover:text-slate-200";
                dateContainer.classList.add('hidden');
            }
            renderApp();
        }

        // Render standard scrollable date strip
        function renderDateStrip() {
            const container = document.getElementById('date-strip');
            container.innerHTML = '';
            const today = new Date();
            
            // Show last 6 days + today
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(today.getDate() - i);
                const dateKey = formatDateKey(d);
                const isSelected = dateKey === selectedDate;
                const isToday = i === 0;

                const dayName = d.toLocaleDateString('en-US', { weekday: 'short' });
                const dayNum = d.getDate();

                const btn = document.createElement('button');
                btn.onclick = () => {
                    selectedDate = dateKey;
                    renderDateStrip();
                    renderApp();
                };
                btn.className = `flex-1 min-w-[52px] py-2.5 px-2 rounded-xl flex flex-col items-center justify-center transition-all ${
                    isSelected 
                        ? 'bg-slate-700 text-emerald-400 border border-emerald-500/50 shadow-md' 
                        : 'bg-slate-800/60 text-slate-400 border border-slate-700/40 hover:border-slate-600'
                }`;
                btn.innerHTML = `
                    <span class="text-[10px] font-medium tracking-wide ${isSelected ? 'text-emerald-400' : 'text-slate-400'}">${isToday ? 'Today' : dayName}</span>
                    <span class="text-sm font-bold mt-0.5 ${isSelected ? 'text-white' : 'text-slate-300'}">${dayNum}</span>
                `;
                container.appendChild(btn);
            }
        }

        // Render main view based on habits and tab
        function renderApp() {
            const container = document.getElementById('habit-container');
            container.innerHTML = '';

            if (habits.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 px-4 rounded-2xl bg-slate-800/40 border border-slate-800">
                        <i data-lucide="sparkles" class="w-10 h-10 text-emerald-400 mx-auto mb-3 opacity-80"></i>
                        <h3 class="text-base font-semibold text-slate-200">No habits created yet</h3>
                        <p class="text-xs text-slate-400 max-w-xs mx-auto mt-1 mb-4">Start small. Focus on tiny daily gains to build lasting identity shifts.</p>
                        <button onclick="openModal()" class="bg-emerald-500 text-slate-950 font-semibold text-xs px-4 py-2 rounded-xl">Create your first habit</button>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            if (currentTab === 'week') {
                habits.forEach(habit => {
                    const isCompleted = habit.history && habit.history[selectedDate];
                    
                    // "Never Miss Twice" logic check for yesterday
                    const yesterday = new Date();
                    yesterday.setDate(new Date().getDate() - 1);
                    const yesterdayKey = formatDateKey(yesterday);
                    const missedYesterday = habit.history && !habit.history[yesterdayKey];

                    const card = document.createElement('div');
                    card.className = `p-4 rounded-2xl border transition-all ${
                        isCompleted 
                            ? 'bg-emerald-950/20 border-emerald-500/30' 
                            : 'bg-slate-800/80 border-slate-700/50 hover:border-slate-600'
                    }`;

                    card.innerHTML = `
                        <div class="flex items-center justify-between gap-3">
                            <div class="flex-1 min-w-0">
                                ${habit.identity ? `<span class="text-[10px] font-semibold text-emerald-400 tracking-wider uppercase block mb-0.5">${escapeHtml(habit.identity)}</span>` : ''}
                                <h3 class="text-sm font-semibold text-slate-100 truncate">${escapeHtml(habit.name)}</h3>
                                ${habit.twoMin ? `<p class="text-xs text-slate-400 truncate mt-0.5"><span class="text-slate-500">2-min:</span> ${escapeHtml(habit.twoMin)}</p>` : ''}
                            </div>
                            <button onclick="toggleHabit('${habit.id}', '${selectedDate}')" class="w-10 h-10 rounded-xl flex items-center justify-center transition-all ${
                                isCompleted 
                                    ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/20' 
                                    : 'bg-slate-700/60 text-slate-400 hover:bg-slate-700'
                            }">
                                <i data-lucide="${isCompleted ? 'check' : 'circle'}" class="w-5 h-5"></i>
                            </button>
                        </div>
                        ${missedYesterday && !isCompleted && selectedDate === formatDateKey(new Date()) ? `
                            <div class="mt-3 pt-2 border-t border-slate-700/40 flex items-center gap-1.5 text-[11px] text-amber-400">
                                <i data-lucide="alert-circle" class="w-3.5 h-3.5"></i>
                                <span>Missed yesterday! Focus on completing today — <strong>Never miss twice.</strong></span>
                            </div>
                        ` : ''}
                    `;
                    container.appendChild(card);
                });
            } else {
                // Monthly view grid
                const now = new Date();
                const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
                const currentMonthName = now.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

                habits.forEach(habit => {
                    let completedCount = 0;
                    let gridHtml = '';

                    for (let d = 1; d <= daysInMonth; d++) {
                        const dateObj = new Date(now.getFullYear(), now.getMonth(), d);
                        const dateKey = formatDateKey(dateObj);
                        const done = habit.history && habit.history[dateKey];
                        if (done) completedCount++;

                        gridHtml += `
                            <div title="${dateKey}" class="aspect-square rounded-md flex items-center justify-center text-[10px] font-medium ${
                                done ? 'bg-emerald-500 text-slate-950' : 'bg-slate-700/40 text-slate-500'
                            }">${d}</div>
                        `;
                    }

                    const pct = Math.round((completedCount / daysInMonth) * 100);

                    const card = document.createElement('div');
                    card.className = "p-4 rounded-2xl bg-slate-800/80 border border-slate-700/50 space-y-3";
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="text-sm font-semibold text-slate-100">${escapeHtml(habit.name)}</h3>
                                <p class="text-xs text-slate-400 mt-0.5">${currentMonthName}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-xs font-bold text-emerald-400">${completedCount}/${daysInMonth}</span>
                                <span class="text-[10px] text-slate-400 block">${pct}% rate</span>
                            </div>
                        </div>
                        <div class="grid grid-cols-7 gap-1.5 pt-1">
                            ${gridHtml}
                        </div>
                        <div class="pt-2 flex justify-end">
                            <button onclick="deleteHabit('${habit.id}')" class="text-xs text-rose-400 hover:text-rose-300 flex items-center gap-1 opacity-70 hover:opacity-100 transition-all">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                Delete Habit
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
            lucide.createIcons();
        }

        // Toggle state for habit on target date
        function toggleHabit(id, dateKey) {
            habits = habits.map(h => {
                if (h.id === id) {
                    const history = h.history || {};
                    if (history[dateKey]) {
                        delete history[dateKey];
                    } else {
                        history[dateKey] = true;
                    }
                    return { ...h, history };
                }
                return h;
            });
            saveToStorage();
            renderApp();
        }

        // Form Submission
        function saveHabit(e) {
            e.preventDefault();
            const name = document.getElementById('input-name').value.trim();
            const identity = document.getElementById('input-identity').value.trim();
            const twoMin = document.getElementById('input-two-min').value.trim();

            if (!name) return;

            const newHabit = {
                id: Date.now().toString(),
                name,
                identity,
                twoMin,
                history: {}
            };

            habits.push(newHabit);
            saveToStorage();
            closeModal();
            renderApp();
        }

        // Delete Habit
        function deleteHabit(id) {
            if (confirm('Are you sure you want to delete this habit?')) {
                habits = habits.filter(h => h.id !== id);
                saveToStorage();
                renderApp();
            }
        }

        // Helpers
        function saveToStorage() {
            localStorage.setItem('atomic_habits', JSON.stringify(habits));
        }

        function openModal() {
            document.getElementById('habit-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('habit-form').reset();
            document.getElementById('habit-modal').classList.add('hidden');
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
